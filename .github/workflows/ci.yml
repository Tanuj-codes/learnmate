name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learnmate
          POSTGRES_PASSWORD: learnmate
          POSTGRES_DB: learnmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://learnmate:learnmate@127.0.0.1:5432/learnmate?schema=public
      JWT_SECRET: ci-only-learnmate-secret-with-at-least-32-chars
      BCRYPT_ROUNDS: "10"
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run server and client tests
        run: npm test

      - name: Build the client
        run: npm run build
